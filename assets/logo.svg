<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <title>Craterellus</title>
  <defs>
    <linearGradient id="stem" x1="0" x2="1">
      <stop offset="0" stop-color="#DDA23C"/>
      <stop offset="1" stop-color="#B27A22"/>
    </linearGradient>
    <linearGradient id="gills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BDB3A8"/>
      <stop offset="1" stop-color="#9A9086"/>
    </linearGradient>
    <radialGradient id="cap" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#5F4D38"/>
      <stop offset="1" stop-color="#7A6749"/>
    </radialGradient>
  </defs>

  <!-- stem: yellow, bent to the left, thicker at the top -->
  <path d="M 92 132 C 88 160 80 186 72 216 C 78 226 94 226 98 216
           C 104 188 110 160 114 132 Z" fill="url(#stem)"/>
  <path d="M 108 140 C 104 166 99 190 93 214" fill="none" stroke="#8E5E18" stroke-width="3.2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 96 140 C 93 160 88 180 83 200" fill="none" stroke="#F0C060" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>

  <!-- funnel underside: grey gills, lopsided (left side hangs lower) -->
  <path d="M 16 82 C 30 104 66 118 90 136 L 116 136
           C 132 116 160 98 186 70
           C 150 84 60 92 16 82 Z" fill="url(#gills)"/>
  <g fill="none" stroke="#857B71" stroke-width="1.8" stroke-linecap="round">
    <path d="M 34 92 C 58 108 80 122 94 134"/>
    <path d="M 62 96 C 78 110 90 122 99 134"/>
    <path d="M 92 96 C 98 110 102 122 104 134"/>
    <path d="M 124 94 C 118 108 112 122 108 134"/>
    <path d="M 156 86 C 140 102 124 118 112 134"/>
  </g>

  <!-- top of the cap: a ruffled, crooked rim seen from the side, lighter wavy edge -->
  <path d="M 12 80
           C 16 70 26 74 32 66 C 40 58 50 68 58 62
           C 66 54 78 60 86 56 C 96 50 104 60 114 54
           C 124 48 134 58 144 52 C 154 46 162 56 172 52
           C 180 48 190 58 188 68
           C 182 78 176 80 168 82 C 160 86 154 80 146 86
           C 138 92 130 86 120 90 C 110 95 102 89 92 93
           C 82 97 74 91 64 94 C 54 97 46 90 36 92
           C 28 93 22 88 16 88 C 12 87 10 84 12 80 Z"
        fill="url(#cap)" stroke="#CDB67C" stroke-width="3.2" stroke-linejoin="round"/>

  <g fill="none" stroke="#4E3F2F" stroke-width="1.6" stroke-linecap="round" opacity="0.75">
    <path d="M 64 92 C 66 84 70 78 76 74"/>
    <path d="M 120 89 C 120 81 122 75 126 70"/>
    <path d="M 146 85 C 148 78 152 73 158 69"/>
    <path d="M 36 91 C 38 85 42 81 48 78"/>
  </g>
</svg>
